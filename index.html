    function AgeGateModal() {
      const [isVerified, setIsVerified] = useState(true);
      const [underAge, setUnderAge] = useState(false);

      useEffect(() => {
        const ageVerified = localStorage.getItem('feco_age_verified');
        if (!ageVerified) {
          setIsVerified(false);
        }
      }, []);

      const handleConfirmAge = () => {
        localStorage.setItem('feco_age_verified', 'true');
        setIsVerified(true);
      };

      const handleUnderAge = () => {
        setUnderAge(true);
      };

      if (isVerified) return null;

      return (
        <React.Fragment>
          <div className="cart-backdrop" style={{ zIndex: 2000, background: 'rgba(0,0,0,0.95)' }}></div>
          <div className="modal d-block" tabIndex="-1" role="dialog" style={{ zIndex: 2005 }}>
            <div className="modal-dialog modal-dialog-centered" role="document">
              <div className="modal-content bg-black border border-warning text-light p-4 text-center">
                <div className="mb-3">
                  <img
                    src="./app/img/logo/leaf.png"
                    alt="Club Feco Leaf Logo"
                    width="60"
                    height="55"
                    className="mb-2"
                  />
                  <h3 className="text-warning fw-bold">Age Verification Required</h3>
                </div>

                {underAge ? (
                  <div className="py-4">
                    <i className="fas fa-exclamation-triangle fa-3x text-danger mb-3"></i>
                    <h5 className="text-danger fw-bold mb-3">Access Restricted</h5>
                    <p className="text-muted fs-5">
                      You must be 18 years of age or older to enter Club Feco and view our infused products.
                    </p>
                    <button
                      className="btn btn-outline-warning mt-3"
                      onClick={() => setUnderAge(false)}
                    >
                      Back to Age Check
                    </button>
                  </div>
                ) : (
                  <div className="py-3">
                    <p className="fs-4 mb-4">
                      Welcome to <strong>Club Feco</strong>. Are you at least 18 years of age?
                    </p>

                    <div className="d-grid gap-3 d-sm-flex justify-content-sm-center">
                      <button
                        className="btn btn-warning btn-lg px-4 font-weight-bold text-dark me-sm-2"
                        onClick={handleConfirmAge}
                        style={{ letterSpacing: '1px', borderRadius: '6px' }}
                      >
                        <i className="fas fa-check-circle me-2"></i> YES, I AM 18 OR OLDER
                      </button>
                      <button
                        className="btn btn-outline-secondary btn-lg px-4"
                        onClick={handleUnderAge}
                        style={{ borderRadius: '6px' }}
                      >
                        I AM UNDER 18
                      </button>
                    </div>
                    <p className="text-muted small mt-4 mb-0">
                      By entering, you confirm you are of legal age to view infused product content in your jurisdiction.
                    </p>
                  </div>
                )}
              </div>
            </div>
          </div>
        </React.Fragment>
      );
    }

    function OwnerPinModal({ isOpen, onClose, onSuccess }) {
      const [pin, setPin] = useState('');
      const [error, setError] = useState('');

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        const storedPin = localStorage.getItem('feco_owner_pin') || '1234';
        if (pin === storedPin) {
          setError('');
          setPin('');
          onSuccess();
        } else {
          setError('Incorrect PIN. Try default (1234)');
        }
      };

      const handleClose = () => {
        setPin('');
        setError('');
        onClose();
      };

      return (
        <React.Fragment>
          <div className="cart-backdrop" onClick={handleClose} style={{ zIndex: 1045 }}></div>
          <div className="modal d-block" tabIndex="-1" role="dialog" style={{ zIndex: 1048 }}>
            <div className="modal-dialog modal-dialog-centered" role="document">
              <div className="modal-content bg-black border border-warning text-light p-3">
                <div className="modal-header border-bottom border-warning pb-2">
                  <h5 className="modal-title text-warning fw-bold d-flex align-items-center">
                    <i className="fas fa-lock me-2"></i> Owner Access Required
                  </h5>
                  <button
                    type="button"
                    className="btn btn-link text-warning fs-2 p-0 text-decoration-none"
                    onClick={handleClose}
                    aria-label="Close Modal"
                    style={{ lineHeight: 1 }}
                  >
                    &times;
                  </button>
                </div>

                <form onSubmit={handleSubmit} className="modal-body py-4">
                  <p className="text-muted fs-6 mb-3">
                    Please enter your store owner 4-digit PIN to access customer orders.
                  </p>

                  {error && <div className="alert alert-danger py-2 mb-3">{error}</div>}

                  <div className="mb-4">
                    <label className="form-label text-light fs-5">4-Digit PIN</label>
                    <input
                      type="password"
                      maxLength="6"
                      className="form-control bg-dark text-warning border-warning fs-3 text-center py-2"
                      style={{ letterSpacing: '8px' }}
                      placeholder="••••"
                      value={pin}
                      onChange={(e) => setPin(e.target.value)}
                      autoFocus
                      required
                    />
                    <div className="form-text text-muted small mt-2">Default PIN: 1234</div>
                  </div>

                  <div className="d-grid gap-2">
                    <button type="submit" className="btn btn-warning text-dark font-weight-bold py-2">
                      Unlock Orders Dashboard
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </React.Fragment>
      );
    }

    function ProductCard({
      imgSrc,

      flavors,

    function CartDrawer({ isOpen, onClose, cart, updateQty, removeItem, clearCart, onSaveOrder }) {
      const [view, setView] = useState('cart'); // 'cart' | 'checkout' | 'success'
      const [orderNum, setOrderNum] = useState('');
      const [checkoutForm, setCheckoutForm] = useState({
        name: '',
        email: '',
        address: '',
        payment: 'delivery'
      });

      const getSubtotal = () => {
        return cart.reduce((total, item) => total + (item.price * item.count), 0);
      };

      const handleCheckoutSubmit = (e) => {
        e.preventDefault();
        if (!checkoutForm.name || !checkoutForm.email || !checkoutForm.address) {
          alert('Please fill out all fields.');
          return;
        }

        const randomNum = 'F-' + Math.floor(10000 + Math.random() * 90000);
        const newOrder = {
          id: randomNum,
          customer: { ...checkoutForm },
          items: [...cart],
          subtotal: getSubtotal(),
          timestamp: new Date().toISOString(),
          status: 'Pending'
        };

        if (onSaveOrder) {
          onSaveOrder(newOrder);
        }

        setOrderNum(randomNum);
        setView('success');
        clearCart();
      };

      const handleClose = () => {
        onClose();
        setTimeout(() => setView('cart'), 500);
      };

      return (
        <React.Fragment>
          {isOpen && <div className="cart-backdrop" onClick={handleClose}></div>}

          <div className={`cart-drawer ${isOpen ? 'open' : ''} p-4`}>
            {/* Drawer Header */}
            <div className="d-flex justify-content-between align-items-center border-bottom border-warning pb-3 mb-3">
              <h3 className="text-warning font-weight-bold m-0 d-flex align-items-center">
                <i className="fas fa-shopping-cart me-2"></i>
                {view === 'cart' ? 'Your Cart' : view === 'checkout' ? 'Checkout' : 'Success!'}
              </h3>
              <button
                onClick={handleClose}
                className="btn btn-link text-warning p-0 fs-1 text-decoration-none"
                style={{ lineHeight: '1' }}
              >
                &times;
              </button>
            </div>

            {/* View 1: Cart Items */}
            {view === 'cart' && (
              <div className="d-flex flex-column flex-grow-1" style={{ overflow: 'hidden' }}>
                {cart.length === 0 ? (
                  <div className="d-flex flex-column align-items-center justify-content-center flex-grow-1 text-muted">
                    <i className="fas fa-shopping-basket fa-3x mb-3 text-warning opacity-50"></i>
                    <p className="fs-4">Your cart is empty</p>
                  </div>
                ) : (
                  <React.Fragment>
                    <div className="flex-grow-1" style={{ overflowY: 'auto' }}>
                      {cart.map((item) => (
                        <div key={item.id} className="cart-item-row d-flex py-3 align-items-center">
                          <img
                            src={item.imgSrc}
                            alt={item.name}
                            style={{ width: '50px', height: '50px', objectFit: 'cover', borderRadius: '4px' }}
                            className="me-3"
                          />
                          <div className="flex-grow-1">
                            <h5 className="text-light m-0 font-weight-bold">{item.name}</h5>
                            <span className="text-muted fs-6">
                              Flavor: <strong className="text-warning">{item.flavor}</strong> | Qty: {item.quantitySelect}
                            </span>
                            <div className="d-flex align-items-center justify-content-between mt-2">
                              <span className="text-warning fs-5 fw-bold">£{(item.price * item.count).toFixed(2)}</span>

                              <div className="d-flex align-items-center">
                                <button className="btn-qty" onClick={() => updateQty(item.id, -1)}>-</button>
                                <span className="mx-3 text-white fw-bold fs-5">{item.count}</span>
                                <button className="btn-qty" onClick={() => updateQty(item.id, 1)}>+</button>
                              </div>
                            </div>
                          </div>

                          <button
                            onClick={() => removeItem(item.id)}
                            className="btn btn-link text-danger ms-3 p-1 fs-4"
                            aria-label="Remove Item"
                          >
                            &times;
                          </button>
                        </div>
                      ))}
                    </div>

                    <div className="border-top border-warning pt-3 mt-auto">
                      <div className="d-flex justify-content-between align-items-center mb-3">
                        <span className="fs-3 text-light">Subtotal:</span>
                        <span className="fs-2 text-warning fw-bold">£{getSubtotal().toFixed(2)}</span>
                      </div>
                      <button
                        onClick={() => setView('checkout')}
                        className="btn btn-warning btn-lg w-100 text-dark font-weight-bold"
                        style={{ letterSpacing: '2px', borderRadius: '6px' }}
                      >
                        PROCEED TO CHECKOUT

    function App() {
      const [showScrollBtn, setShowScrollBtn] = useState(false);
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isPinModalOpen, setIsPinModalOpen] = useState(false);
      const [isAdminOrdersOpen, setIsAdminOrdersOpen] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const [activeCategory, setActiveCategory] = useState('all');
      const [orders, setOrders] = useState(() => {
        try {
          const saved = localStorage.getItem('feco_orders');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      useEffect(() => {
        const handleScroll = () => {
          if (window.scrollY > 20) {
            setShowScrollBtn(true);
          } else {
            setShowScrollBtn(false);
          }
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const scrollToTop = () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleSaveOrder = (newOrder) => {
        setOrders((prevOrders) => {
          const updated = [newOrder, ...prevOrders];
          localStorage.setItem('feco_orders', JSON.stringify(updated));
          return updated;
        });
      };

      const handleUpdateOrderStatus = (orderId, newStatus) => {
        setOrders((prevOrders) => {
          const updated = prevOrders.map((order) =>
            order.id === orderId ? { ...order, status: newStatus } : order
          );
          localStorage.setItem('feco_orders', JSON.stringify(updated));
          return updated;
        });
      };

      const handleDeleteOrder = (orderId) => {
        setOrders((prevOrders) => {
          const updated = prevOrders.filter((order) => order.id !== orderId);
          localStorage.setItem('feco_orders', JSON.stringify(updated));
          return updated;
        });
      };

      const handleClearCompletedOrders = () => {
        setOrders((prevOrders) => {
          const updated = prevOrders.filter((order) => order.status !== 'Completed');
          localStorage.setItem('feco_orders', JSON.stringify(updated));
          return updated;
        });
      };

      const handleAddToCart = (productName, defaultImgSrc, flavor, quantitySelect, basePrice, priceCalculator, imageMap) => {
        const itemPrice = priceCalculator ? priceCalculator(quantitySelect) : basePrice;
        const itemImgSrc = (imageMap && imageMap[flavor]) || defaultImgSrc;
        const itemId = `${productName}-${flavor}-${quantitySelect}`;

        setCart((prevCart) => {
          const existingItem = prevCart.find((i) => i.id === itemId);
          if (existingItem) {
            return prevCart.map((i) =>
              i.id === itemId ? { ...i, count: i.count + 1 } : i
            );
          } else {
            return [
              ...prevCart,
              {
                id: itemId,
                name: productName,
                imgSrc: itemImgSrc,
                flavor,
                quantitySelect,
                price: itemPrice,
                count: 1
              }
            ];
          }
        });

        setIsCartOpen(true);
      };

      const updateQty = (id, change) => {
        setCart((prevCart) =>
          prevCart.map((item) => {
            if (item.id === id) {
              const newQty = item.count + change;
              return newQty > 0 ? { ...item, count: newQty } : item;
            }
            return item;
          })
        );
      };

      const removeItem = (id) => {
        setCart((prevCart) => prevCart.filter((item) => item.id !== id));
      };

      const clearCart = () => {
        setCart([]);
      };

      const getCartCount = () => {
        return cart.reduce((sum, item) => sum + item.count, 0);
      };

      const smokelessFlavors = [
        { value: 'Pineapple', label: 'Pineapple' },
        { value: 'Mango', label: 'Mango' },
        { value: 'Apple', label: 'Apple' },
        { value: 'Orange', label: 'Orange' },
        { value: 'Grape', label: 'Grape' }
      ];

      const smokelessQuantities = [
        { value: '100mg', label: '100mg' },
        { value: '250mg', label: '250mg' },
        { value: '500mg', label: '500mg' }
      ];

      const calculateSmokelessPrice = (strength) => {
        switch (strength) {
          case '250mg': return 14.99;
          case '500mg': return 24.99;
          default: return 9.99;
        }
      };

      const shotsFlavors = [
        { value: 'Fruit Punch', label: 'Fruit Punch' },
        { value: 'Strawberry', label: 'Strawberry' },
        { value: 'Kola Champagne', label: 'Kola Champagne' },
        { value: 'Grape', label: 'Grape' },
        { value: 'Pineapple', label: 'Pineapple' },
        { value: 'Mango', label: 'Mango' },
        { value: 'Pineapple & Ginger', label: 'Pineapple & Ginger' },
        { value: 'S&G', label: 'Sorrel & Ginger (S&G)' },
        { value: 'Cherry', label: 'Cherry' }
      ];

      const genericQuantities = Array.from({ length: 7 }, (_, i) => ({
        value: String(i + 1),
        label: String(i + 1)
      }));

      const chocolateFlavors = [
        { value: 'Baileys & Honeycomb', label: 'Baileys & Honeycomb 250mg' },
        { value: 'Cashews', label: 'Cashews 250mg' },
        { value: 'Dry Roasted Nuts', label: 'Dry Roasted Nuts 250mg' },
        { value: 'Fruit & Nut', label: 'Fruit & Nut 250mg' },
        { value: 'Honey Roasted Nuts', label: 'Honey Roasted Nuts 250mg' },
        { value: 'Milk Chocolate', label: 'Milk Chocolate 250mg' },
        { value: 'Rum & Raisin', label: 'Rum & Raisin 250mg' },
        { value: 'Vodka & Cranberries', label: 'Vodka & Cranberries 250mg' },
        { value: 'Whiskey & Fruits', label: 'Whiskey & Fruits 500mg' }
      ];

      const smokelessImages = {
        Pineapple: './app/img/smokeless/Smokeless - Pineapple.png',
        Mango: './app/img/smokeless/Smokeless - Mango.png',
        Apple: './app/img/smokeless/Smokeless - Apple.png',
        Orange: './app/img/smokeless/Smokeless - Orange.png',
        Grape: './app/img/smokeless/Smokeless - Grape.png'
      };

      const shotsImages = {
        'Fruit Punch': './app/img/shots/FECO SHOTS - FRUIT PUNCH.png',
        Strawberry: './app/img/shots/FECO_SHOTS_STRAWBERRY.png',
        'Kola Champagne': './app/img/shots/FECO SHOTS - KOLA CHAMPAGNE.png',
        Grape: './app/img/shots/FECO SHOTS - GRAPE (2).png',
        Pineapple: './app/img/shots/FECO SHOTS - PINEAPPLE.png',
        Mango: './app/img/shots/FECO SHOTS - MANGO.png',
        'Pineapple & Ginger': './app/img/shots/FECO SHOTS - PINEAPPLE & GINGER.png',
        'S&G': './app/img/shots/FECO SHOTS - SORREL & GINGER_LITE.png',
        Cherry: './app/img/shots/FECO_SHOTS_CHERRY_LITE.webp'
      };

      const contenderImages = {
        'Fruit Punch': './app/img/contender/CONTENDER FRUIT PUNCH (2).png',
        Strawberry: './app/img/contender/CONTENDER STRAWBERRY (2).png',
        'Kola Champagne': './app/img/contender/CONTENDER KOLA CHAMPAGNE (2).png',
        Grape: './app/img/contender/CONTENDER GRAPE (2).png',
        Pineapple: './app/img/contender/CONTENDER PINEAPPLE (2).png',
        Mango: './app/img/contender/CONTENDER_MANGO400x280.webp',
        'S&G': './app/img/contender/CONTENDER S&G.png',
        Cherry: './app/img/contender/CONTENDER CHERRY (2).png'
      };

      const chocolateImages = {
        'Baileys & Honeycomb': './public/img/chocolates/BAILEYS & HONEYCOMB 250MG.png',
        Cashews: './public/img/chocolates/CASHEWS 250MG.png',
        'Dry Roasted Nuts': './public/img/chocolates/DRY ROASTED NUTS 250MG.png',
        'Fruit & Nut': './public/img/chocolates/FRUIT & NUT 250MG.png',
        'Honey Roasted Nuts': './public/img/chocolates/HONEY ROASTED NUTS 250MG.png',
        'Milk Chocolate': './public/img/chocolates/MILK CHOCOLATE 250MG.png',
        'Rum & Raisin': './public/img/chocolates/RUM & RAISIN 250MG.png',
        'Vodka & Cranberries': './public/img/chocolates/VODKA & CRANBERRIES 250MG.png',
        'Whiskey & Fruits': './public/img/chocolates/WHISKEY & FRUITS  500MG.png'
      };

      const filterMatches = (title, flavorsList) => {
        if (!searchTerm) return true;
        const term = searchTerm.toLowerCase();
        const titleMatch = title.toLowerCase().includes(term);
        const flavorMatch = flavorsList.some((f) =>
          f.value.toLowerCase().includes(term) || f.label.toLowerCase().includes(term)
        );
        return titleMatch || flavorMatch;
      };

      return (
        <div className="bg-black text-light min-vh-100">
          <Navbar
            cartCount={getCartCount()}
            onCartClick={() => setIsCartOpen(true)}
            pendingOrdersCount={orders.filter((o) => o.status === 'Pending').length}
            onOpenAdminOrders={() => setIsPinModalOpen(true)}
          />
          <Hero />

          <ProductSearchBar
            searchTerm={searchTerm}
            setSearchTerm={setSearchTerm}
            activeCategory={activeCategory}
            setActiveCategory={setActiveCategory}
          />

          <section className="news-input p-4">
            <div className="container">
              <div className="d-md-flex justify-content-between align-items-center">
                <h2 className="mb-3 mb-md-0">Contact your local supplier...</h2>
              </div>
            </div>
          </section>

          <About />

          {/* Smokeless Section */}
          {(activeCategory === 'all' || activeCategory === 'smokeless') && filterMatches('Smokeless Selection', smokelessFlavors) && (
            <ProductSection
              id="smokeless"
              title="Smokeless Selection"
              imgSrc="./app/img/about/smokeless_about.webp"
              imgAlt="CBD Fresh Juices in Glasses"
              subTitle="CBD with a Burst of Freshness"
              description="Our CBD-infused fresh juices offer a delightful way to incorporate CBD into your daily routine. Sourced from premium hemp extracts, our CBD is blended with the purest, juiciest fruits to create a truly refreshing and revitalizing experience. Each sip provides a moment of relaxation and rejuvenation, making it the perfect addition to your morning routine or as a pick-me-up throughout the day."
              bullets={[
                '100% Pure & Natural.',
                'Various strengths available',
                'A Refreshing Twist on Wellness',
                'Vegan Friendly'
              ]}
            >
              <ProductCard
                imgSrc="./app/img/smokeless/Smokeless - Pineapple.png"
                imgAlt="CBD Fresh Fruit Juices"
                flavors={smokelessFlavors}
                quantities={smokelessQuantities}
                borderColorClass="border-warning"
                buttonId="feedbackButtonSmokeless"
                imageMap={smokelessImages}
                onAddToCart={(flavor, qty) =>
                  handleAddToCart('Smokeless Juice', './app/img/smokeless/Smokeless - Pineapple.png', flavor, qty, 9.99, calculateSmokelessPrice, smokelessImages)
                }
              />
            </ProductSection>
          )}

          {/* Shots Section */}
          {(activeCategory === 'all' || activeCategory === 'shots') && filterMatches('Shots Selection', shotsFlavors) && (
            <ProductSection
              id="shots"
              title="Shots Selection"
              imgSrc="./app/img/about/shots_selection_500x332.webp"
              imgAlt="CBD Tincture Bottles"
              subTitle="Pure, Potent, and Packed with Benefits"
              description="We've taken the last 7 years to perfect our recipe because we specialize in only providing the Highest Quality Best Tasting infused syrups. No other syrup compares to Feco Shots! Just like our other CBD products, our canna-infused syrups undergo rigorous quality testing to ensure they meet Our High Standards. We take pride in delivering a pure and potent experience that you can trust."
              bullets={[
                '100% Pure Sugar Cane Rum.',
                'Rapid Long Lasting Effects',
                'A Unique Blend Formulated by A.I.',
                'Official Collector\'s Edition Rum'
              ]}
            >
              <ProductCard
                imgSrc="./app/img/shots/FECO SHOTS - FRUIT PUNCH.png"
                imgAlt="Jar of topicals cream"
                flavors={shotsFlavors}
                quantities={genericQuantities}
                borderColorClass="border-warning"
                buttonId="feedbackButtonShots"
                imageMap={shotsImages}
                onAddToCart={(flavor, qty) =>
                  handleAddToCart('Feco Shot', './app/img/shots/FECO SHOTS - FRUIT PUNCH.png', flavor, qty, 19.99, null, shotsImages)
                }
              />
            </ProductSection>
          )}

          {/* Contender Section */}
          {(activeCategory === 'all' || activeCategory === 'cocktails') && filterMatches('Contender Selection', shotsFlavors) && (
            <ProductSection
              id="cocktails"
              title="Contender Selection"
              imgSrc="./app/img/about/club_feco_500x282.webp"
              imgAlt="Various CBD drinks in glasses"
              subTitle="Embrace the spirit of adventure"
              description="Prepare to transcend ordinary spirits with our unparalleled fusion of high-end oils and Jamaican White Rum. Meticulously crafted for versatility, it seamlessly combines with a multitude of spirits and cocktails, offering a truly unique and indulgent experience."
              bullets={[
                '100% Pure Sugar Cane Rum',
                'An Exceptional Blend Perfected by Artificial Intelligence',
                'Encounter Swift and Enduring Pleasures',
                'The Apex of Distinction',
                'An Official Collector\'s Edition Rum'
              ]}
            >
              <ProductCard
                imgSrc="./app/img/contender/CONTENDER FRUIT PUNCH (2).png"
                imgAlt="CBD cocktails"
                flavors={shotsFlavors}
                quantities={genericQuantities}
                borderColorClass="border-success"
                buttonId="feedbackButtonCocktails"
                imageMap={contenderImages}
                onAddToCart={(flavor, qty) =>
                  handleAddToCart('Contender Cocktail', './app/img/contender/CONTENDER FRUIT PUNCH (2).png', flavor, qty, 24.99, null, contenderImages)
                }
              />
            </ProductSection>
          )}

          {/* Chocolate Section */}
          {(activeCategory === 'all' || activeCategory === 'chocolates') && filterMatches('Chocolate Selection', chocolateFlavors) && (
            <ProductSection
              id="chocolates"
              title="Chocolate Selection"
              imgSrc="./app/img/about/chocolate_about_500x391.webp"
              imgAlt="CBD Chocolate Selection"
              subTitle="CBD-Infused Chocolates: A Decadent Delight"
              description="We use a variety of chocolates according to each recipe to ensure that we achieve a unique set of chocolates for our infusion."
              bullets={[
                'Delicious Wellness',
                'Various strengths available',
                'New Alcohol Infused Chocolates',
                'Wide selection available'
              ]}
            >
              <ProductCard
                imgSrc="./public/img/chocolates/BAILEYS & HONEYCOMB 250MG.png"
                imgAlt="CBD chocolates"
                flavors={chocolateFlavors}
                quantities={genericQuantities}
                borderColorClass="border-warning"
                buttonId="feedbackButtonChocolate"
                imageMap={chocolateImages}
                onAddToCart={(flavor, qty) =>
                  handleAddToCart('Infused Chocolate Bar', './public/img/chocolates/BAILEYS & HONEYCOMB 250MG.png', flavor, qty, 14.99, null, chocolateImages)
                }
              />
            </ProductSection>
          )}

          <section className="bg-black py-5">
            <div
              id="carouselDarkVariant"
              className="carousel slide carousel-fade carousel-dark mx-auto"
              data-mdb-ride="carousel"
              style={{ maxWidth: '800px' }}
            >
              <div className="carousel-indicators">
                <button
                  data-mdb-target="#carouselDarkVariant"
                  data-mdb-slide-to="0"
                  className="active"
                  aria-current="true"
                  aria-label="Slide 1"
                ></button>
                <button
                  data-mdb-target="#carouselDarkVariant"
                  data-mdb-slide-to="1"
                  aria-label="Slide 2"
                ></button>
                <button
                  data-mdb-target="#carouselDarkVariant"
                  data-mdb-slide-to="2"
                  aria-label="Slide 3"
                ></button>
              </div>

              <div className="carousel-inner">
                <div className="carousel-item active">
                  <img
                    src="./app/img/carousel/cannabisPlant.webp"
                    loading="lazy"
                    className="d-block w-100 rounded"
                    alt="Cannabis Plant"
                    style={{ height: '450px', objectFit: 'cover' }}
                  />
                </div>
                <div className="carousel-item">
                  <img
                    src="./app/img/about/chocolate_about_500x391.webp"
                    loading="lazy"
                    className="d-block w-100 rounded"
                    alt="CBD Chocolates"
                    style={{ height: '450px', objectFit: 'cover' }}
                  />
                </div>
                <div className="carousel-item">
                  <img
                    src="./app/img/carousel/tincturePipe.webp"
                    loading="lazy"
                    className="d-block w-100 rounded"
                    alt="CBD Tincture Collection"
                    style={{ height: '450px', objectFit: 'cover' }}
                  />
                </div>
              </div>
            </div>
          </section>

          <Footer />

          {/* Floating Cart Button */}
          <button
            className="floating-cart-btn"
            onClick={() => setIsCartOpen(true)}
            aria-label="Open Shopping Cart"
          >
            <i className="fas fa-shopping-cart fa-lg"></i>
            {getCartCount() > 0 && (
              <span className="floating-cart-badge">{getCartCount()}</span>
            )}
          </button>

          {/* Scroll to Top Button */}
          {showScrollBtn && (
            <button
              onClick={scrollToTop}
              id="myBtn"
              title="Go to top"
              className="d-block"
              style={{
                position: 'fixed',
                bottom: '20px',
                right: '30px',
                zIndex: 99,
                border: 'none',
                outline: 'none',
                backgroundColor: '#ffb338',
                color: '#000',
                cursor: 'pointer',
                padding: '12px 18px',
                borderRadius: '4px',
                fontSize: '16px',
                fontWeight: 'bold',
                boxShadow: '0px 4px 10px rgba(0, 0, 0, 0.3)'
              }}
            >
              top
            </button>
          )}

          {/* Checkout Cart Drawer Component */}
          <CartDrawer
            isOpen={isCartOpen}
            onClose={() => setIsCartOpen(false)}
            cart={cart}
            updateQty={updateQty}
            removeItem={removeItem}
            clearCart={clearCart}
            onSaveOrder={handleSaveOrder}
          />

          {/* Store Owner Orders Management Modal */}
          <AdminOrdersModal
            isOpen={isAdminOrdersOpen}
            onClose={() => setIsAdminOrdersOpen(false)}
            orders={orders}
            onUpdateStatus={handleUpdateOrderStatus}
            onDeleteOrder={handleDeleteOrder}
            onClearCompleted={handleClearCompletedOrders}
          />

          {/* Owner PIN Verification Lock Modal */}
          <OwnerPinModal
            isOpen={isPinModalOpen}
            onClose={() => setIsPinModalOpen(false)}
            onSuccess={() => {
              setIsPinModalOpen(false);
              setIsAdminOrdersOpen(true);
            }}
          />

          {/* Age Verification Gate (18+) */}
          <AgeGateModal />

          <FeedbackModal />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- MDB JavaScript -->
  <script src="./app/js/mdb.min.js" type="text/javascript"></script>
</body>

</html>
