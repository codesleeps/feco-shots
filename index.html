  <!-- Premium glassmorphic styling for checkout cart -->
  <style>
    .cart-drawer {
      position: fixed;
      top: 0;
      right: -420px;
      width: 420px;
      height: 100vh;
      background: rgba(10, 11, 13, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-left: 3px solid #ffb338;
      z-index: 1050;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
    }

    .cart-drawer.open {
      right: 0;
    }

    @media (max-width: 450px) {
      .cart-drawer {
        width: 100%;
        right: -100%;
        border-left: none;
      }
    }

    .cart-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: 1040;
    }

    .cart-item-row {
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      transition: background 0.3s;
    }

    .cart-item-row:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .floating-cart-btn {
      position: fixed;
      bottom: 90px;
      right: 30px;
      z-index: 99;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 3px solid #ffb338;
      background: rgba(5, 6, 7, 0.9);
      color: #ffb338;
      box-shadow: 0 4px 15px rgba(255, 179, 56, 0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .floating-cart-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(255, 179, 56, 0.5);
    }

    .floating-cart-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #dc3545;
      color: white;
      border-radius: 50%;
      padding: 3px 7px;
      font-size: 11px;
      font-weight: bold;
    }

    .btn-qty {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      width: 25px;
      height: 25px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .btn-qty:hover {
      background: #ffb338;
      color: black;
    }

    .input-glass {
      background: rgba(255, 255, 255, 0.05) !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      color: white !important;
      border-radius: 6px !important;

    .input-glass:focus {
      border-color: #ffb338 !important;
      box-shadow: 0 0 0 0.25rem rgba(255, 179, 56, 0.25) !important;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- React Code using Babel Standalone -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    }

    function Hero() {

          <div
            className="p-5 text-center bg-image"
            style={{
              backgroundImage: "url('./app/img/logo/hero2_501x301.webp')",

            }}
          >
            <div className="mask" style={{ backgroundColor: 'rgba(0, 0, 0, 0.2)' }}>
              <div className="d-flex justify-content-center align-items-center h-100">
                <div className="text-white">
                  <div className="wrapper mb-5">
                    <div className="bg">Club Feco</div>
                    <div className="fg">Club Feco</div>
                  </div>

                  <a
                    href="https://www.bccannabisstores.com/"

                    rel="noopener noreferrer"
                    className="animated-button1 mt-5"
                  >
                    <h1>
                      <span></span>

                      <span></span>
                      welcome
                    </h1>
                  </a>

    }

    function About() {
      return (
        <section id="about" className="about bg-black text-light p-3 fs-3">
          <div className="container">
            <div className="row">
              <div className="col-lg-4">
                <img
                  src="./app/img/about/about_club_500x334.webp"
                  width="500"
                  height="334"
                  loading="lazy"
                  className="img-fluid mt-5 rounded rounded-3"
                  alt="Cannabis indoor farm"
                />
              </div>
              <div className="col-lg-8 pt-4 pt-lg-0">
                <a
                  href="https://codesleeps.github.io/solid-octo-enigma/"
                  aria-label="Enter This Cannabis Quiz"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  <h2 className="text-success mb-3 display-2 fw-normal">About Us</h2>
                </a>
                <p className="mt-3">
                  At <em>Club Feco</em>, we're dedicated to bringing you the finest Canna products that promote
                  wellness and relaxation. Explore our <em>diverse range</em> of CBD products, including CBD-infused
                  drinks, shots, cocktails, and chocolates, designed to cater to your unique preferences and needs.
                  CBD is typically extracted from hemp, a variety of cannabis with low levels of THC. 😁

    function ProductCard({
      imgSrc,
      imgAlt,
      flavors,
      quantities,
      borderColorClass = 'border-warning',
      buttonId,
      ratingText = '⭐⭐⭐⭐⭐',
      onAddToCart,
      imageMap
    }) {
      const [selectedFlavor, setSelectedFlavor] = useState(flavors[0]?.value || '');
      const [selectedQuantity, setSelectedQuantity] = useState(quantities[0]?.value || '');

      const handleOrderSubmit = () => {
        onAddToCart(selectedFlavor, selectedQuantity);
      };

      // Resolve current image dynamically based on selected flavor mapping
      const currentImgSrc = (imageMap && imageMap[selectedFlavor]) || imgSrc;

      return (
        <div className="col">
          <div className={`card h-100 border border-3 ${borderColorClass}`}>
            <img
              src={currentImgSrc}
              className="card-img-top"
              alt={imgAlt}
              loading="lazy"
              style={{ objectFit: 'contain', height: '295px', padding: '10px' }}
            />
            <div className="card-body px-2">
              <div className="card-text text-light">
                <a
                  href="#exampleModal"
                  type="button"
                  data-mdb-toggle="modal"
                  data-mdb-target="#exampleModal"
                  aria-label="Submit Feedback"
                  className="text-decoration-none"
                >
                  {ratingText}
                </a>
                <br />
                <em className="fs-3">Selection</em>

                {/* Flavor Select */}
                <div className="product-size-container mt-2">
                  <select
                    value={selectedFlavor}
                    onChange={(e) => setSelectedFlavor(e.target.value)}
                    aria-label="flavours"
                    className="form-select bg-dark text-light border-secondary py-1"
                    style={{ width: '100%', borderRadius: '4px' }}
                  >
                    {flavors.map((opt) => (
                      <option key={opt.value} value={opt.value}>
                        {opt.label}
                      </option>
                    ))}
                  </select>
                </div>

                {/* Quantity Select */}
                <div className="product-quantity-container mt-2">
                  <select
                    value={selectedQuantity}
                    onChange={(e) => setSelectedQuantity(e.target.value)}
                    aria-label="quantity"
                    className="form-select bg-dark text-light border-secondary py-1"
                    style={{ width: '100%', borderRadius: '4px' }}
                  >
                    {quantities.map((opt) => (
                      <option key={opt.value} value={opt.value}>
                        {opt.label}
                      </option>
                    ))}
                  </select>
                </div>
              </div>

              {/* Add to Cart Trigger */}
              <button
                id={buttonId}
                onClick={handleOrderSubmit}
                className="button-85 mt-3 w-100 border-0"
                role="button"
              >
                <span className="text-light text-decoration-none d-block w-100 h-100 py-1">
                  Add to Cart
                </span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    function ProductSection({
      id,
      title,
      quizUrl = 'https://codesleeps.github.io/solid-octo-enigma/',
      imgSrc,
      imgAlt,
      subTitle,
      subTitleColorClass = 'text-danger',
      description,
      bullets = [],
      children
    }) {
      return (
        <section id={id} className="about bg-black text-light p-3">
          <div>
            <a
              href={quizUrl}
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Enter This Cannabis Quiz"
              className="text-decoration-none"
            >
              <h2 className="card-body text-center display-2 bg-black fw-normal pb-5 text-light">
                <em>{title}</em>
              </h2>
            </a>
          </div>

          <div className="container mb-4">
            <div className="row">
              <div className="col-lg-4 d-flex align-items-center justify-content-center">
                <img
                  src={imgSrc}
                  className="img-fluid rounded rounded-3"
                  loading="lazy"
                  alt={imgAlt}
                  style={{ maxHeight: '350px', objectFit: 'cover' }}
                />
              </div>
              <div className="col-lg-8 pt-4 pt-lg-0">
                <h3 className={`${subTitleColorClass} mb-3 display-5 fw-normal`}>{subTitle}</h3>
                <p className="fs-3">{description}</p>
                {bullets.length > 0 && (
                  <ul className="fs-4 text-success mt-3">
                    {bullets.map((bullet, idx) => (
                      <li key={idx}>{bullet}</li>
                    ))}
                  </ul>
                )}
              </div>
            </div>
          </div>

          <div className="container feco-shots pt-lg-0 pb-1 fs-3 bg-black">
            <div className="row row-cols-1 row-cols-lg-3 row-cols-md-2 g-4 mx-1 mb-5">
              {children}
            </div>
          </div>
        </section>
      );
    }

    function CartDrawer({ isOpen, onClose, cart, updateQty, removeItem, clearCart }) {
      const [view, setView] = useState('cart'); // 'cart' | 'checkout' | 'success'
      const [orderNum, setOrderNum] = useState('');
      const [checkoutForm, setCheckoutForm] = useState({
        name: '',
        email: '',
        address: '',
        payment: 'delivery'
      });

      const getSubtotal = () => {
        return cart.reduce((total, item) => total + (item.price * item.count), 0);
      };

      const handleCheckoutSubmit = (e) => {
        e.preventDefault();
        if (!checkoutForm.name || !checkoutForm.email || !checkoutForm.address) {
          alert('Please fill out all fields.');
          return;
        }

        const randomNum = 'F-' + Math.floor(10000 + Math.random() * 90000);
        setOrderNum(randomNum);
        setView('success');
        clearCart();
      };

      const handleClose = () => {
        onClose();
        setTimeout(() => setView('cart'), 500);
      };

      return (
        <React.Fragment>
          {isOpen && <div className="cart-backdrop" onClick={handleClose}></div>}

          <div className={`cart-drawer ${isOpen ? 'open' : ''} p-4`}>
            {/* Drawer Header */}
            <div className="d-flex justify-content-between align-items-center border-bottom border-warning pb-3 mb-3">
              <h3 className="text-warning mb-0 fs-2 font-weight-bold">
                <i className="fas fa-shopping-cart me-2"></i>
                {view === 'cart' ? 'Your Cart' : view === 'checkout' ? 'Checkout' : 'Success!'}
              </h3>
              <button
                onClick={handleClose}
                className="btn btn-link text-warning p-0 fs-1 text-decoration-none"
                style={{ lineHeight: '1' }}
              >
                &times;
              </button>
            </div>

            {/* View 1: Cart Items */}
            {view === 'cart' && (
              <div className="d-flex flex-column flex-grow-1" style={{ overflow: 'hidden' }}>
                {cart.length === 0 ? (
                  <div className="d-flex flex-column align-items-center justify-content-center flex-grow-1 text-muted">
                    <i className="fas fa-shopping-basket fa-3x mb-3 text-warning opacity-50"></i>
                    <p className="fs-4">Your cart is empty</p>
                  </div>
                ) : (
                  <React.Fragment>
                    <div className="flex-grow-1" style={{ overflowY: 'auto' }}>
                      {cart.map((item) => (
                        <div key={item.id} className="cart-item-row d-flex py-3 align-items-center">
                          <img
                            src={item.imgSrc}
                            alt={item.name}
                            style={{ width: '50px', height: '50px', objectFit: 'cover', borderRadius: '4px' }}
                            className="me-3"
                          />
                          <div className="flex-grow-1 text-light">
                            <h5 className="fs-5 mb-0 fw-bold">{item.name}</h5>
                            <span className="text-muted fs-6" style={{ letterSpacing: '0' }}>
                              {item.flavor} / {item.quantitySelect}
                            </span>
                            <div className="d-flex align-items-center justify-content-between mt-2">
                              <span className="text-warning fs-5 fw-bold">£{(item.price * item.count).toFixed(2)}</span>

                              <div className="d-flex align-items-center">
                                <button className="btn-qty" onClick={() => updateQty(item.id, -1)}>-</button>
                                <span className="mx-3 text-white fw-bold fs-5">{item.count}</span>
                                <button className="btn-qty" onClick={() => updateQty(item.id, 1)}>+</button>
                              </div>
                            </div>
                          </div>

                          <button
                            onClick={() => removeItem(item.id)}
                            className="btn btn-link text-danger ms-3 p-1 fs-4"
                            aria-label="Remove Item"
                          >
                            <i className="fas fa-trash-alt"></i>
                          </button>
                        </div>
                      ))}
                    </div>

                    <div className="border-top border-secondary pt-3 mt-3">
                      <div className="d-flex justify-content-between align-items-center mb-3">
                        <span className="fs-3 text-light">Subtotal:</span>
                        <span className="fs-2 text-warning fw-bold">£{getSubtotal().toFixed(2)}</span>
                      </div>
                      <button
                        onClick={() => setView('checkout')}
                        className="btn btn-warning btn-lg w-100 text-dark font-weight-bold"
                        style={{ letterSpacing: '2px', borderRadius: '6px' }}
                      >
                        PROCEED TO CHECKOUT
                      </button>
                    </div>
                  </React.Fragment>
                )}
              </div>
            )}

            {/* View 2: Checkout Form */}
            {view === 'checkout' && (
              <form onSubmit={handleCheckoutSubmit} className="d-flex flex-column flex-grow-1" style={{ overflowY: 'auto' }}>
                <div className="mb-3">
                  <label htmlFor="chkName" className="form-label text-light fs-5">Full Name</label>
                  <input
                    type="text"
                    id="chkName"
                    required
                    placeholder="Enter your name"
                    className="form-control input-glass py-2"
                    value={checkoutForm.name}
                    onChange={(e) => setCheckoutForm({ ...checkoutForm, name: e.target.value })}
                  />
                </div>

                <div className="mb-3">
                  <label htmlFor="chkEmail" className="form-label text-light fs-5">Email Address</label>
                  <input
                    type="email"
                    id="chkEmail"
                    required
                    placeholder="name@example.com"
                    className="form-control input-glass py-2"
                    value={checkoutForm.email}
                    onChange={(e) => setCheckoutForm({ ...checkoutForm, email: e.target.value })}
                  />
                </div>

                <div className="mb-3">
                  <label htmlFor="chkAddress" className="form-label text-light fs-5">Delivery Address</label>
                  <textarea
                    id="chkAddress"
                    required
                    rows="3"
                    placeholder="Street, City, Postal Code"
                    className="form-control input-glass py-2"
                    value={checkoutForm.address}
                    onChange={(e) => setCheckoutForm({ ...checkoutForm, address: e.target.value })}
                  />
                </div>

                <div className="mb-4">
                  <label className="form-label text-light fs-5">Payment Method</label>
                  <select
                    className="form-select input-glass py-2"
                    style={{ width: '100%' }}
                    value={checkoutForm.payment}
                    onChange={(e) => setCheckoutForm({ ...checkoutForm, payment: e.target.value })}
                  >
                    <option value="delivery">Cash on Delivery</option>
                    <option value="transfer">Bank Transfer (Manual)</option>
                  </select>
                </div>

                <div className="border-top border-secondary pt-3 mt-auto">
                  <div className="d-flex justify-content-between align-items-center mb-3">
                    <span className="fs-3 text-light">Total Amount:</span>
                    <span className="fs-2 text-warning fw-bold">£{getSubtotal().toFixed(2)}</span>
                  </div>

                  <div className="row g-2">
                    <div className="col-6">
                      <button
                        type="button"
                        onClick={() => setView('cart')}
                        className="btn btn-outline-warning w-100 font-weight-bold"
                        style={{ borderRadius: '6px' }}
                      >
                        BACK TO CART
                      </button>
                    </div>
                    <div className="col-6">
                      <button
                        type="submit"
                        className="btn btn-warning w-100 text-dark font-weight-bold"
                        style={{ borderRadius: '6px' }}
                      >
                        PLACE ORDER
                      </button>
                    </div>
                  </div>
                </div>
              </form>
            )}

            {/* View 3: Order Success Screen */}
            {view === 'success' && (
              <div className="d-flex flex-column align-items-center justify-content-center flex-grow-1 text-center text-light">
                <div className="mb-4">
                  <i className="fas fa-circle-check fa-5x text-success"></i>
                </div>
                <h4 className="text-warning fs-1 font-weight-bold mb-3">Order Received!</h4>
                <p className="fs-4 px-2 mb-2">Thank you for your order, <strong>{checkoutForm.name}</strong>!</p>
                <p className="fs-5 text-muted px-2">We have sent a receipt to {checkoutForm.email}. Your local supplier will contact you soon for delivery details.</p>
                <div className="bg-dark border border-secondary p-3 rounded my-4 w-100">
                  <span className="text-muted d-block fs-6">Order Number</span>
                  <span className="text-warning font-weight-bold fs-3" style={{ letterSpacing: '3px' }}>{orderNum}</span>
                </div>

      useEffect(() => {
        const handleScroll = () => {
          if (window.scrollY > 20) {
            setShowScrollBtn(true);
          } else {
            setShowScrollBtn(false);
          }
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const scrollToTop = () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // Add Item to Checkout Cart
      const handleAddToCart = (productName, defaultImgSrc, flavor, quantitySelect, basePrice, priceCalculator, imageMap) => {
        const itemPrice = priceCalculator ? priceCalculator(quantitySelect) : basePrice;

        // Dynamic image based on flavor selection map
        const itemImgSrc = (imageMap && imageMap[flavor]) || defaultImgSrc;

        // Dynamic ID key based on properties
        const itemId = `${productName}-${flavor}-${quantitySelect}`;

        setCart((prevCart) => {
          const existingItem = prevCart.find((i) => i.id === itemId);
          if (existingItem) {
            return prevCart.map((i) =>
              i.id === itemId ? { ...i, count: i.count + 1 } : i
            );
          } else {
            return [
              ...prevCart,
              {
                id: itemId,
                name: productName,
                imgSrc: itemImgSrc,
                flavor,
                quantitySelect,
                price: itemPrice,
                count: 1
              }
            ];
          }
        });

        // Open cart drawer for confirmation

        setCart((prevCart) =>

            return item;
